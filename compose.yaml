# Εκτέλεση μιας δημοσιευμένης έκδοσης μαζί με PostgreSQL, χωρίς build από τον κώδικα:
#   ESCAPEHUB_VERSION=0.1.0 docker compose up
# Ο κωδικός της βάσης ορίζεται με ESCAPEHUB_DB_PASSWORD. Η προεπιλογή ισχύει μόνο για τοπική χρήση.
services:
  app:
    image: ghcr.io/pii/escapehub:${ESCAPEHUB_VERSION:-0.1.0}
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/escapehub
      SPRING_DATASOURCE_USERNAME: escapehub
      SPRING_DATASOURCE_PASSWORD: ${ESCAPEHUB_DB_PASSWORD:-escapehub}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: escapehub
      POSTGRES_USER: escapehub
      POSTGRES_PASSWORD: ${ESCAPEHUB_DB_PASSWORD:-escapehub}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escapehub -d escapehub"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
