spring.application.name=escapehub
management.endpoints.web.exposure.include=health,info

# Βάση δεδομένων
# Τοπικά: το spring-boot:run ξεκινά την PostgreSQL από το compose.dev.yaml (απαιτεί Docker).
# Σε container ή παραγωγή: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD.
spring.docker.compose.file=compose.dev.yaml
spring.jpa.open-in-view=false

# Το σχήμα δημιουργείται μόνο από τις migrations του Flyway. Το JPA απλώς το επικυρώνει.
spring.jpa.hibernate.ddl-auto=validate
# Επιτρέπει migrations από παράλληλα PRs (ονομασία με timestamp, βλ. CONTRIBUTING.md).
spring.flyway.out-of-order=true

# Τεκμηρίωση του REST API (TS-07): /swagger-ui.html και /v3/api-docs, μόνο για το /api/**.
springdoc.paths-to-match=/api/**
